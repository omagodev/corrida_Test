<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Créditos do DRIFT CIRCUIT: agradecimento a Atos Vinicius pela criação do jogo.">
<meta name="theme-color" content="#080b12">
<title>Créditos — DRIFT CIRCUIT</title>
<style>
:root{--bg:#080b12;--ink:#f2f5fa;--muted:#c7d2e0;--amber:#ffd166;--cool:#63d7ff}
*{box-sizing:border-box}
body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#1a2939,var(--bg) 65%);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
main{width:min(560px,100%);padding:clamp(24px,6vw,44px);border:1px solid rgba(255,255,255,.16);border-left:5px solid var(--amber);background:linear-gradient(160deg,#151d2b,#0d131d);box-shadow:0 24px 60px rgba(0,0,0,.45)}
.eyebrow{margin:0 0 8px;color:var(--cool);font-size:11px;letter-spacing:.28em;text-transform:uppercase}
h1{margin:0;font-size:clamp(36px,8vw,60px);line-height:1.05}
.name{margin:28px 0 8px;color:var(--amber);font-size:clamp(24px,6vw,38px);font-weight:800}
.credit{margin:0;color:var(--muted);font-size:17px;line-height:1.5}
nav{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
a{display:inline-block;padding:12px 18px;border:1px solid rgba(255,255,255,.3);color:var(--ink);font-size:14px;font-weight:700;text-decoration:none}
a:first-child{border-color:var(--amber);background:var(--amber);color:#0b0f16}
a:hover,a:focus-visible{border-color:var(--cool);outline:2px solid var(--cool);outline-offset:2px}
</style>
</head>
<body>
<main>
  <p class="eyebrow">DRIFT CIRCUIT</p>
  <h1>Créditos</h1>
  <p class="name">Atos Vinicius</p>
  <p class="credit">Criador do jogo DRIFT CIRCUIT. Obrigado por criar o jogo!</p>
  <nav aria-label="Navegação">
    <a href="./index.html">Jogar</a>
    <a href="./landing.html">Sobre o projeto</a>
  </nav>
</main>
</body>
</html>
